<!DOCTYPE html>
<html lang="en">
<head>
  <title>Array Function Example</title>
</head>
<body>
  <h1>Enter 5 Numbers</h1>

  <script>
    function showArray(arr) {
      console.log("You entered:");
      for (let i = 0; i < arr.length; i++) {
        console.log("Element " + (i+1) + ": " + arr[i]);
      }
    }

    let numbers = [];
    for (let i = 0; i < 5; i++) {
      let input = prompt("Enter number " + (i+1) + ":");
      numbers.push(Number(input)); // convert to number
    }

    showArray(numbers);
  </script>
</body>
</html>
