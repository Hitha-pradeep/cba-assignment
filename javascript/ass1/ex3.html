<!DOCTYPE html>
<html lang="en">
<head>
  <title>Multiplication Table</title>
</head>
<body>
  <h1>Multiplication Table</h1>
  
  <script>
    let number = 6;
    for (let i = 1; i <= 10; i++) {
      let result = number * i;
      console.log(number + " x " + i + " = " + result);
      document.write(number + " x " + i + " = " + result + "<br>");
    }
  </script>
</body>
</html>
