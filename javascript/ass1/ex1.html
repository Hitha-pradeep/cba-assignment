<!DOCTYPE html>
<html lang="en">
<head>
  <title>Variables and Arithmetic</title>
</head>
<body>
  <h1>JavaScript Variables and Arithmetic</h1>
  <p>operations</p>
  <script>
    let num1 = 12; 
    let num2 = 4; 
      let sum = num1 + num2;
      let difference = num1 - num2;
      let product = num1 * num2;
      let quotient = num2 !== 0 ? num1 / num2 : "Division by zero is not allowed";

      console.log("Number 1:", num1);
      console.log("Number 2:", num2);
      console.log("Sum:", sum);
      console.log("Difference:", difference);
      console.log("Product:", product);
      console.log("Quotient:", quotient);
  </script>
</body>
</html>
