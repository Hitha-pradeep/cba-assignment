<!DOCTYPE html>
<html lang="en">
<head>
  <title>Even or Odd Number</title>
</head>
<body>
  <h1>Check Even or Odd</h1>
  
  <script>
    let number = 15; 
    if (number % 2 === 0) {
      console.log(number + " is Even");
      document.write(number + " is Even");
    } else {
      console.log(number + " is Odd");
      document.write(number + " is Odd");
    }
  </script>
</body>
</html>
