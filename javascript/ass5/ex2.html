<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Profile Card</title>
  <style>
    .card {
      width: 300px;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      background-color: #f4f4f4;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin: 50px auto;
      font-family: Arial, sans-serif;
    }
    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 15px;
    }
    .card button {
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007BFF;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/100" alt="Profile Image" class="profile-img">
    <h2 class="name">John Doe</h2>
    <p class="profession">Web Developer</p>
    <button class="update-btn">Update Profile</button>
  </div>

  <script>
    const nameEl = document.querySelector(".name");
    const professionEl = document.querySelector(".profession");
    const imgEl = document.querySelector(".profile-img");
    const cardEl = document.querySelector(".card");
    const buttonEl = document.querySelector(".update-btn");

    buttonEl.addEventListener("click", function() {
      nameEl.textContent = "Jane Smith";
      professionEl.textContent = "UI/UX Designer";
      imgEl.src = "https://via.placeholder.com/100/ff7f7f/ffffff?text=JS";
      cardEl.style.backgroundColor = "#ffe4e1";
    });
  </script>
</body>
</html>
