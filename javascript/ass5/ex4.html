<!DOCTYPE html>
<html>
<head>
  <title>Product Availability Status</title>
  <style>
    .card {
      width: 300px;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      background-color: #f4f4f4;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin: 50px auto;
      font-family: Arial, sans-serif;
    }
    .status {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0;
    }
    .available {
      color: green;
    }
    .unavailable {
      color: red;
    }
    .card button {
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007BFF;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="product-name">Laptop</h2>
    <p class="status available">Available</p>
    <button class="toggle-btn">Toggle Availability</button>
  </div>

  <script>
    const statusEl = document.querySelector(".status");
    const cardEl = document.querySelector(".card");
    const buttonEl = document.querySelector(".toggle-btn");

    buttonEl.addEventListener("click", function() {
      if (statusEl.classList.contains("available")) {
        statusEl.textContent = "Unavailable";
        statusEl.classList.remove("available");
        statusEl.classList.add("unavailable");
        cardEl.style.backgroundColor = "#ffe4e1"; // light red
      } else {
        statusEl.textContent = "Available";
        statusEl.classList.remove("unavailable");
        statusEl.classList.add("available");
        cardEl.style.backgroundColor = "#e6ffe6"; // light green
      }
    });
  </script>
</body>
</html>
