<!DOCTYPE html>
<html>
<head>
  <title>Student Grade Dashboard</title>
</head>
<body>
  <h2>Exercise 6: Student Grade Dashboard</h2>

  <table id="studentTable" border="1" cellpadding="10" cellspacing="0">
    <tr>
      <th>Student Name</th>
      <th>Marks</th>
      <th>Grade</th>
    </tr>
    <tr>
      <td>Alice</td>
      <td>85</td>
      <td></td>
    </tr>
    <tr>
      <td>Bob</td>
      <td>35</td>
      <td></td>
    </tr>
    <tr>
      <td>Charlie</td>
      <td>72</td>
      <td></td>
    </tr>
    <tr>
      <td>Diana</td>
      <td>90</td>
      <td></td>
    </tr>
    <tr>
      <td>Edward</td>
      <td>40</td>
      <td></td>
    </tr>
  </table>

  <br>
  <button id="updateBtn">Update Grades</button>

  <script>
    const button = document.querySelector("#updateBtn");
    const table = document.querySelector("#studentTable");

    button.addEventListener("click", function() {
      for (let i = 1; i < table.rows.length; i++) {
        let marks = parseInt(table.rows[i].cells[1].textContent);
        let gradeCell = table.rows[i].cells[2];
        let row = table.rows[i];

        // Assign grade
        if (marks >= 80) {
          gradeCell.textContent = "A";
          row.style.backgroundColor = "lightgreen";
        } else if (marks >= 60) {
          gradeCell.textContent = "B";
          row.style.backgroundColor = "";
        } else if (marks >= 40) {
          gradeCell.textContent = "C";
          row.style.backgroundColor = "";
        } else {
          gradeCell.textContent = "F";
          row.style.backgroundColor = "lightcoral";
        }
      }
    });
  </script>
</body>
</html>
