<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Even or Odd (Ternary)</title>
</head>
<body>
  <h2>Exercise 3: Even or Odd Using Ternary Operator</h2>

  <script>
    let number = 17;
    let result = (number % 2 === 0) ? "Even" : "Odd";
    document.write(number + " is " + result);
  </script>
</body>
</html>
