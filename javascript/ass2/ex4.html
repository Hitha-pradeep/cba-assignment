<!DOCTYPE html>
<html lang="en">
<head>
  <title>Multiplication Table</title>
</head>
<body>
  <h2>Exercise 4: Multiplication Table</h2>
  <script>
    let number = 5;
    for (let i = 1; i <= 10; i++) {
      let result = number * i;
      document.write(number + " x " + i + " = " + result + "<br>");
    }
  </script>
</body>
</html>
