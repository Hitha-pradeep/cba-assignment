<!DOCTYPE html>
<html lang="en">
<head>
  <title>Divisible by 7 and 9</title>
</head>
<body>
  <h2>Exercise 8: First Number Divisible by Both 7 and 9</h2>
  <script>
    let result = null;
    for (let i = 1; i <= 500; i++) {
      if (i % 7 === 0 && i % 9 === 0) {
        result = i;
        break; // stop the loop once found
      }
    }
    document.write("The first number between 1 and 500 divisible by both 7 and 9 is: " + result);
  </script>
</body>
</html>
