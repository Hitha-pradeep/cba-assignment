<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login System</title>
</head>
<body>
  <h2>Exercise 7: Login System Using switch</h2>
  <script>
    let role = "admin"; 
    switch (role) {
      case "admin":
        document.write("Full Access");
        break;
      case "manager":
        document.write("Limited Access");
        break;
      case "employee":
        document.write("Read Only Access");
        break;
      default:
        document.write("Invalid Role");
    }
  </script>
</body>
</html>
