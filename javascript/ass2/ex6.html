<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sum of Even Numbers</title>
</head>
<body>
  <h2>Exercise 6: Sum of Even Numbers (1 to 100)</h2>
  <script>
    let sum = 0;
    for (let i = 1; i <= 100; i++) {
      if (i % 2 === 0) { 
        sum += i;
      }
    }
    document.write("Sum of even numbers between 1 and 100: " + sum);
  </script>
</body>
</html>
