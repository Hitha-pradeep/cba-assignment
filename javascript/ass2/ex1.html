<!DOCTYPE html>
<html lang="en">
<head>
  <title>Number Type Conversion</title>
</head>
<body>
  <h2>Exercise 1: Number Type Conversion</h2>
  <script>
    let strNumber = "250";          
    let num = Number(strNumber);    
    let result = num + 50;          
    document.write("Result: " + result); 
  </script>
</body>
</html>
