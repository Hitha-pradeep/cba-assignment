<!DOCTYPE html>
<html lang="en">
<head>
  <title>FizzBuzz Program</title>
</head>
<body>
  <h2>Exercise: FizzBuzz (1–50)</h2>
  <script>
    for (let i = 1; i <= 50; i++) {
      if (i % 3 === 0 && i % 5 === 0) {
        document.write("FizzBuzz<br>");
      } else if (i % 3 === 0) {
        document.write("Fizz<br>");
      } else if (i % 5 === 0) {
        document.write("Buzz<br>");
      } else {
        document.write(i + "<br>");
      }
    }
  </script>
</body>
</html>
