<!DOCTYPE html>
<html lang="en">
<head>
  <title>User Age Category</title>
</head>
<body>
  <h2>Exercise 2: User Age Category</h2>
  <script>
    let age = 25;  
    if (age < 13) {
      document.write("Child");
    } else if (age >= 13 && age <= 19) {
      document.write("Teenager");
    } else if (age >= 20 && age <= 59) {
      document.write("Adult");
    } else if (age >= 60) {
      document.write("Senior Citizen");
    }
  </script>
</body>
</html>
